[package]
name = "remotelink-platform-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Windows host platform layer: control IPC + DXGI + WASAPI + input (KD5)"
publish = false

[dependencies]
remotelink-common = { workspace = true }
remotelink-media = { workspace = true }
remotelink-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Performance",
] }

[dev-dependencies]
