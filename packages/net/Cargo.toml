[package]
name = "remotelink-net"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RemoteLink PeerTransport trait, mock loopback, live TCP, and WebRTC stack boundary"
publish = false

[features]
default = ["mock", "live"]
# Synthetic in-process PeerTransport for unit tests and CI (no real sockets).
mock = []
# Length-prefixed TCP PeerTransport for local multi-process demos (pure Rust).
# Included in default so workspace tests cover loopback; apps still default to
# mock via REMOTELINK_TRANSPORT / TransportConfig (CI-safe path).
live = ["dep:serde", "dep:serde_json", "dep:sha2", "dep:rand", "dep:hex"]
# Pure-Rust webrtc-rs (webrtc crate 0.11) PeerTransport backend.
# **Off by default** so CI stays lean; enable with `--features webrtc-rs`.
# Pulls tokio + webrtc; windows-gnu probe succeeded for 0.11.
webrtc-rs = [
    "dep:webrtc",
    "dep:tokio",
    "dep:bytes",
    "dep:sha2",
    "dep:rcgen",
    "dep:hex",
]

[dependencies]
remotelink-protocol = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
# webrtc-rs feature only
webrtc = { version = "0.11", optional = true }
tokio = { workspace = true, optional = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
bytes = { version = "1", optional = true }
rcgen = { version = "0.13", optional = true }

[dev-dependencies]
