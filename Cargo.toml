[workspace]
resolver = "2"
members = [
    "packages/common",
    "packages/protocol",
    "packages/auth",
    "apps/host",
    "apps/viewer",
    "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "RemoteLink: low-latency remote desktop with system audio"
# repository = omitted until the real remote URL is known

[workspace.dependencies]
remotelink-common = { path = "packages/common", version = "0.1.0" }
remotelink-protocol = { path = "packages/protocol", version = "0.1.0" }
remotelink-auth = { path = "packages/auth", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = { version = "0.5", features = ["std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
