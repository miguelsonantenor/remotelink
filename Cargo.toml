[workspace]
resolver = "2"
members = [
    "packages/common",
    "apps/host",
    "apps/viewer",
    "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "RemoteLink: low-latency remote desktop with system audio"
repository = "https://github.com/remotelink/remotelink"

[workspace.dependencies]
remotelink-common = { path = "packages/common", version = "0.1.0" }
