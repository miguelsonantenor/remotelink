name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-linux:
    name: Linux fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: packaging inventory smoke
        shell: pwsh
        run: ./scripts/list-package-binaries.ps1

  rust-windows:
    name: Windows test (host / platform)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # MSVC on windows-latest works best with the `windows` crate (DXGI/WASAPI/MF).
      - name: cargo test host + platform-windows + e2e live
        run: |
          cargo test -p remotelink-platform-windows --lib
          cargo test -p remotelink-host --lib
          cargo test -p remotelink-e2e --test ws_cli_live --test ws_agent_ipc -- --nocapture

      - name: packaging inventory smoke
        shell: pwsh
        run: ./scripts/list-package-binaries.ps1

  package-stage:
    name: Release package stage (Windows)
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-linux, rust-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Stage portable core product (zip + layout)
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Try MSI (no-op if WiX missing)
        shell: pwsh
        run: ./scripts/build-msi.ps1 -SkipStage

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remotelink-core-product
          path: |
            dist/remotelink-*/
            dist/RemoteLink-*-portable.zip
            dist/RemoteLink-*.msi
          if-no-files-found: error
