# coturn — host-network profile (Linux). Lab defaults only.
# Shared secret must match server TURN_SHARED_SECRET when REST mint is wired.

listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=remotelink-dev-turn-secret-change-me
realm=remotelink.local

# For production set the public address clients dial:
# external-ip=YOUR.PUBLIC.IP

total-quota=100
bps-capacity=0
stale-nonce=600
no-multicast-peers
no-cli

# Logging
verbose
