# coturn — bridge network (Docker Desktop / Windows lab).
# UDP relay is best-effort; prefer host profile on Linux for real ICE tests.

listening-ip=0.0.0.0
listening-port=3478
tls-listening-port=5349
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=remotelink-dev-turn-secret-change-me
realm=remotelink.local

min-port=49160
max-port=49200

total-quota=50
stale-nonce=600
no-multicast-peers
no-cli
verbose

# Advertise container-reachable address for lab (override for real clients):
# external-ip=127.0.0.1
